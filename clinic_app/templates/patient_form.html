{% extends "base.html" %}
{% block content %}
  <div class="flex items-start justify-between gap-3">
    <div>
      <h1 class="text-xl font-semibold">
        {% if mode == "new" %}New patient{% else %}Edit patient{% endif %}
      </h1>
      <p class="text-sm text-slate-600 mt-1">Maintain complete patient profiles for history and billing.</p>
    </div>
    <a class="text-sm text-blue-700 hover:underline" href="/patients">← Back</a>
  </div>

  <form class="mt-5 grid grid-cols-1 md:grid-cols-2 gap-4"
        method="post"
        action="{% if mode == 'new' %}/patients/new{% else %}/patients/{{ patient.id }}/edit{% endif %}">

    <div class="md:col-span-2">
      <label class="text-sm font-medium">Full name *</label>
      <input name="name" value="{{ patient.name if patient else '' }}" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" required />
    </div>

    <div>
      <label class="text-sm font-medium">Phone</label>
      <input name="phone" value="{{ patient.phone if patient and patient.phone else '' }}" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" />
    </div>

    <div>
      <label class="text-sm font-medium">Email</label>
      <input name="email" value="{{ patient.email if patient and patient.email else '' }}" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" />
    </div>

    <div>
      <label class="text-sm font-medium">DOB</label>
      <input name="dob" type="date" value="{{ patient.dob.isoformat() if patient and patient.dob else '' }}" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" />
    </div>

    <div>
      <label class="text-sm font-medium">Gender</label>
      <select name="gender" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
        {% set g = patient.gender if patient and patient.gender else '' %}
        <option value="" {% if g == '' %}selected{% endif %}>-</option>
        <option value="Female" {% if g == 'Female' %}selected{% endif %}>Female</option>
        <option value="Male" {% if g == 'Male' %}selected{% endif %}>Male</option>
        <option value="Other" {% if g == 'Other' %}selected{% endif %}>Other</option>
      </select>
    </div>

    <div class="md:col-span-2">
      <label class="text-sm font-medium">Address</label>
      <textarea name="address" rows="3" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">{{ patient.address if patient and patient.address else '' }}</textarea>
    </div>

    <div class="md:col-span-2">
      <label class="text-sm font-medium">Notes</label>
      <textarea name="notes" rows="3" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">{{ patient.notes if patient and patient.notes else '' }}</textarea>
    </div>

    <div class="md:col-span-2 flex items-center justify-between gap-3">
      <button class="rounded-lg bg-blue-600 text-white px-4 py-2 text-sm font-medium hover:bg-blue-700">
        Save
      </button>
      {% if mode == "edit" %}
      <a class="text-sm text-slate-500 hover:underline" href="/patients/{{ patient.id }}">Cancel</a>
      {% endif %}
    </div>
  </form>

  {% if mode == "edit" %}
  <form method="post" action="/patients/{{ patient.id }}/delete" class="mt-4">
    <button class="rounded-lg border border-red-300 text-red-700 px-4 py-2 text-sm hover:bg-red-50">
      Delete patient
    </button>
  </form>
  {% endif %}
{% endblock %}
