{% extends "base.html" %}
{% block content %}
  <div class="flex items-start justify-between gap-3">
    <div>
      <h1 class="text-xl font-semibold">
        {% if mode == "new" %}New product{% else %}Edit product{% endif %}
      </h1>
      <p class="text-sm text-slate-600 mt-1">Maintain GST-compliant catalog (HSN + GST rate) for billing and stock.</p>
    </div>
    <a class="text-sm text-blue-700 hover:underline" href="/inventory">← Back</a>
  </div>

  <form class="mt-5 grid grid-cols-1 md:grid-cols-2 gap-4"
        method="post"
        action="{% if mode == 'new' %}/inventory/products/new{% else %}/inventory/products/{{ product.id }}/edit{% endif %}">

    <div class="md:col-span-2">
      <label class="text-sm font-medium">Product name *</label>
      <input name="name" value="{{ product.name if product else '' }}" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" required />
    </div>

    <div>
      <label class="text-sm font-medium">HSN code</label>
      <input name="hsn_code" value="{{ product.hsn_code if product and product.hsn_code else '' }}" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" />
    </div>

    <div>
      <label class="text-sm font-medium">GST rate (%)</label>
      <input name="gst_rate" inputmode="decimal" value="{{ "%.2f"|format(product.gst_rate) if product else '0.00' }}" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" />
    </div>

    <div>
      <label class="text-sm font-medium">Unit</label>
      <input name="unit" value="{{ product.unit if product else 'nos' }}" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" />
    </div>

    <div>
      <label class="text-sm font-medium">Reorder level</label>
      <input name="reorder_level" type="number" min="0" value="{{ product.reorder_level if product else 10 }}" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" />
    </div>

    <div class="md:col-span-2 flex items-center justify-between gap-3">
      <button class="rounded-lg bg-blue-600 text-white px-4 py-2 text-sm font-medium hover:bg-blue-700">
        Save
      </button>
      {% if mode == "edit" %}
      <a class="text-sm text-slate-500 hover:underline" href="/inventory/products/{{ product.id }}">Cancel</a>
      {% endif %}
    </div>
  </form>

  {% if mode == "edit" %}
  <form method="post" action="/inventory/products/{{ product.id }}/delete" class="mt-4">
    <button class="rounded-lg border border-red-300 text-red-700 px-4 py-2 text-sm hover:bg-red-50">
      Delete product
    </button>
  </form>
  {% endif %}
{% endblock %}
