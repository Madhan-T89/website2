{% extends "base.html" %}
{% block content %}
  <div class="flex items-start justify-between gap-3">
    <div>
      <h1 class="text-xl font-semibold">New purchase</h1>
      <p class="text-sm text-slate-600 mt-1">Enter invoice items with batch number and expiry date to update stock.</p>
    </div>
    <a class="text-sm text-blue-700 hover:underline" href="/purchases">← Back</a>
  </div>

  <form method="post" action="/purchases/new" class="mt-5 space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="text-sm font-medium">Vendor name *</label>
        <input name="vendor_name" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" required />
      </div>
      <div>
        <label class="text-sm font-medium">Invoice no *</label>
        <input name="invoice_no" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 font-mono" required />
      </div>
      <div>
        <label class="text-sm font-medium">Invoice date</label>
        <input name="invoice_date" type="date" value="{{ today.isoformat() }}" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" />
      </div>
      <div class="md:col-span-3">
        <label class="text-sm font-medium">Notes</label>
        <textarea name="notes" rows="2" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2"></textarea>
      </div>
    </div>

    <div class="rounded-xl border border-slate-200 p-4">
      <div class="flex items-center justify-between gap-2">
        <div class="font-medium">Items</div>
        <button type="button" id="addRow" class="rounded-lg border border-slate-300 px-3 py-1 text-sm hover:bg-slate-50">+ Add row</button>
      </div>

      <div class="mt-3 overflow-x-auto">
        <table class="min-w-full text-sm" id="itemsTable">
          <thead>
            <tr class="text-left text-slate-500 border-b">
              <th class="py-2 pr-3">Product</th>
              <th class="py-2 pr-3">Batch *</th>
              <th class="py-2 pr-3">Expiry</th>
              <th class="py-2 pr-3">Qty *</th>
              <th class="py-2 pr-3">Unit price</th>
              <th class="py-2 pr-3">GST %</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="py-2 pr-3">
                <select name="product_id" class="w-56 rounded border border-slate-300 px-2 py-1">
                  {% for pr in products %}
                  <option value="{{ pr.id }}">{{ pr.name }}</option>
                  {% endfor %}
                </select>
              </td>
              <td class="py-2 pr-3"><input name="batch_no" class="w-40 rounded border border-slate-300 px-2 py-1 font-mono" required /></td>
              <td class="py-2 pr-3"><input name="expiry_date" type="date" class="w-40 rounded border border-slate-300 px-2 py-1" /></td>
              <td class="py-2 pr-3"><input name="qty" type="number" min="1" class="w-24 rounded border border-slate-300 px-2 py-1" required /></td>
              <td class="py-2 pr-3"><input name="unit_price" inputmode="decimal" class="w-28 rounded border border-slate-300 px-2 py-1" /></td>
              <td class="py-2 pr-3"><input name="gst_rate" inputmode="decimal" value="0" class="w-24 rounded border border-slate-300 px-2 py-1" /></td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="mt-2 text-xs text-slate-500">Tip: batch and qty are required; GST% is optional.</div>
    </div>

    <button class="rounded-lg bg-blue-600 text-white px-4 py-2 text-sm font-medium hover:bg-blue-700">
      Save purchase
    </button>
  </form>

  <script>
    const addRowBtn = document.getElementById('addRow');
    const tbody = document.querySelector('#itemsTable tbody');
    addRowBtn.addEventListener('click', () => {
      const first = tbody.querySelector('tr');
      const row = first.cloneNode(true);
      row.querySelectorAll('input').forEach(i => { if (i.type !== 'date') i.value = ''; });
      tbody.appendChild(row);
    });
  </script>
{% endblock %}
