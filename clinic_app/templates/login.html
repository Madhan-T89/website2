<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - Clinic Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-cover bg-fixed bg-center flex items-center justify-center p-4" style="background-image: url('/sidh.jpeg')">
    <div class="fixed inset-0 bg-slate-950/40"></div>
    <div class="relative w-full max-w-md rounded-2xl bg-white/95 backdrop-blur border border-slate-200 shadow-sm p-6">
      <div class="mb-5">
        <div class="text-sm text-blue-700 font-semibold">MP Sidha Medicines</div>
        <h1 class="text-2xl font-semibold tracking-tight">Clinic Management Login</h1>
        <p class="text-sm text-slate-600 mt-1">Sign in to manage patients, stock, purchases, and billing.</p>
      </div>

      {% if error %}
      <div class="mb-4 rounded-lg bg-red-50 border border-red-200 px-3 py-2 text-sm text-red-700">
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/login" class="space-y-3">
        <div>
          <label class="text-sm font-medium">Tenant</label>
          <input name="tenant" value="{{ tenant or 'default' }}" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 font-mono" />
          <div class="text-xs text-slate-500 mt-1">Use <span class="font-mono">default</span> unless you created another tenant.</div>
        </div>
        <div>
          <label class="text-sm font-medium">Username</label>
          <input name="username" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" required />
        </div>
        <div>
          <label class="text-sm font-medium">Password</label>
          <input name="password" type="password" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2" required />
        </div>
        <button class="w-full rounded-lg bg-blue-600 text-white py-2 font-medium hover:bg-blue-700">
          Login
        </button>
      </form>

      <div class="mt-4 text-xs text-slate-500">
        Default admin: <span class="font-mono">admin</span> / <span class="font-mono">admin123</span>
      </div>
    </div>
  </body>
</html>
